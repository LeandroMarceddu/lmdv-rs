[package]
name = "lmdv-io"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lmdv-core = { path = "../lmdv-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
notify = "8"
notify-debouncer-full = "0.5"
walkdir = "2"
dirs = "6"
fs2 = "0.4"
blake3 = "1"

# Unix-only: errno codes, `O_NONBLOCK`/`O_NOFOLLOW`, `geteuid` and `SO_PEERCRED`
# for the single-instance socket. Windows builds use the portable fallbacks in
# `read`, `dirs` and `instance` and never link libc.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
