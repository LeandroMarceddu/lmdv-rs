[package]
name = "lmdv-io"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lmdv-core = { path = "../lmdv-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
notify = "8"
notify-debouncer-full = "0.5"
walkdir = "2"
dirs = "6"
fs2 = "0.4"
blake3 = "1"

# Unix-only: errno codes, `O_NONBLOCK`/`O_NOFOLLOW`, `geteuid` and `SO_PEERCRED`
# for the single-instance socket. Windows builds use the portable fallbacks in
# `read`, `dirs` and `instance` and never link libc.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows-only: the per-user registry writes, Default apps hand-off and shell
# refresh for `assoc::windows`; `ShellExecuteW` for user-initiated opens; the
# named pipe/mutex single-instance transport; `GetFileInformationByHandle`
# identities; and the private state-folder DACL. `windows-sys` is already in the
# lockfile through the app's platform crates, so this adds no package.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
