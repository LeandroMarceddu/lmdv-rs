name: Pages

# The project site is static HTML/CSS under site/. Publishing from a workflow
# keeps docs/ (the development notes) out of the public site.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy project site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # The Actions artifact API can lag a few seconds behind the upload on a
      # push-triggered run. deploy-pages then reports 0 artifacts even though
      # the upload succeeded. A short settle keeps the deploy deterministic.
      - name: Wait for the Pages artifact
        run: sleep 20

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
