name: Release

# Cutting a `v*` tag publishes the Linux AppImage + raw binary and the Windows
# installer + raw binary. Windows remains compile-checked in CI; the installer is
# built here but runtime support is not claimed (see OI-155).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  linux:
    name: Linux release (AppImage + raw binary)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            libfontconfig1-dev \
            fonts-dejavu-core \
            fonts-noto-core \
            pkg-config \
            desktop-file-utils \
            libxml2-utils \
            appstream

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-release
          cache-targets: false

      - name: Build release binary
        run: cargo build --release -p lmdv --locked

      # linuxdeploy bundles the shared libraries and writes the AppImage. It is
      # itself an AppImage; GitHub runners have no FUSE, so the AppImage runtime
      # is told to extract itself before running.
      - name: Download linuxdeploy
        run: |
          mkdir -p tools
          curl -fL --retry 3 -o tools/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x tools/linuxdeploy

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          export PATH="$PWD/tools:$PATH"
          scripts/package-appimage.sh --no-build --app-version "${GITHUB_REF_NAME#v}"
          # The script stages AppDir under dist/; it is not a release asset.
          rm -rf dist/AppDir

      - name: Add raw binary
        run: |
          install -Dm755 target/release/lmdv "dist/lmdv-${GITHUB_REF_NAME#v}-x86_64"
          strip "dist/lmdv-${GITHUB_REF_NAME#v}-x86_64" || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows release (installer + raw binary)
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-release
          cache-targets: false

      - name: Build release binary
        run: cargo build --release -p lmdv --locked

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) {
            $makensis = Join-Path $env:ProgramFiles 'NSIS\makensis.exe'
          }
          if (-not (Test-Path $makensis)) {
            throw "NSIS makensis.exe was not found after choco install"
          }
          & $makensis /DVERSION=$version `
            /DSOURCE="$PWD\target\release\lmdv.exe" `
            /DICON="$PWD\assets\lmdv.ico" `
            /DOUTDIR="$PWD\dist" `
            packaging\windows\lmdv.nsi

      - name: Stage raw Windows binary
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          Copy-Item -Path target\release\lmdv.exe `
            -Destination "dist\lmdv-${version}-windows-x86_64.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-release"
          merge-multiple: true

      # The public key ships so a user can verify without cloning the repo.
      - name: Stage release key
        run: cp packaging/lmdv-release-key.asc dist/

      # One checksum file covering every published asset, signed below with the
      # dedicated release key (OI-153). The signature is over SHA256SUMS; the
      # key itself is also an asset.
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          # Exactly the files this release publishes (dist/*): no directories,
          # no SHA256SUMS itself, no GitHub source archives. Sorted by name.
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
            | LC_ALL=C sort -z \
            | xargs -0 -r sha256sum -- > SHA256SUMS
          [ -s SHA256SUMS ] || { echo "no release assets in dist/" >&2; exit 1; }
          # Fail the release if the rows and dist/* disagree.
          awk '{ print $2 }' SHA256SUMS | LC_ALL=C sort > "$RUNNER_TEMP/checksummed"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' \
            | LC_ALL=C sort > "$RUNNER_TEMP/dist-files"
          diff -u "$RUNNER_TEMP/dist-files" "$RUNNER_TEMP/checksummed"
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LMDV_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LMDV_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_PASSPHRASE:-}" ]; then
            echo "::error::release signing secrets LMDV_GPG_PRIVATE_KEY/LMDV_GPG_PASSPHRASE are missing"
            exit 1
          fi
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" > "$GNUPGHOME/private.asc"
          gpg --batch --import "$GNUPGHOME/private.asc"
          printf '%s' "$GPG_PASSPHRASE" > "$GNUPGHOME/passphrase"
          chmod 600 "$GNUPGHOME/passphrase"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$GNUPGHOME/passphrase" \
            --armor --detach-sign --output dist/SHA256SUMS.asc dist/SHA256SUMS
          gpg --batch --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          gpg --batch --list-keys

      # A release keeps its curated notes in docs/releases/<tag>.md; without one
      # (an old tag, a quick patch) GitHub's generated notes stand in.
      - name: Choose release notes
        id: notes
        run: |
          if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            echo "body=docs/releases/${GITHUB_REF_NAME}.md" >> "$GITHUB_OUTPUT"
          fi
          echo "generated=$([ -f "docs/releases/${GITHUB_REF_NAME}.md" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: lmdv ${{ github.ref_name }}
          files: dist/*
          body_path: ${{ steps.notes.outputs.body }}
          generate_release_notes: ${{ steps.notes.outputs.generated }}
